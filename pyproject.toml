[project]
name = "market-research"
version = "0.1.0"
description = "Product sentiment research and Problem Search across Reddit, YouTube, Quora, Amazon, Facebook, Instagram and forums"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "vaderSentiment>=3.3.2"]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
market-research = "market_research.cli:main"

[tool.setuptools]
packages = ["market_research", "market_research.sources"]
